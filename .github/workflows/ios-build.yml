name: Build iOS IPA (v6.18 - BlackBox THC)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign --build-name=6.18.0 --build-number=618

      - name: Package Runner.app into iMask-VPN-v6.18.ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 iMask-VPN-v6.18.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iMask-VPN-v6.18-iOS-IPA
          path: iMask-VPN-v6.18.ipa
          if-no-files-found: error

      - name: Publish iMask-VPN-v6.18.ipa to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.18
          name: "iMask VPN v6.18 (BlackBox THC)"
          files: iMask-VPN-v6.18.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
