name: Build iOS IPA (v6.18 - BlackBox THC)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA on macOS
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure iOS Podfile and Deployment Target 15.0
        run: |
          flutter build ios --config-only --no-codesign --build-name=6.18.0 --build-number=618 || true
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj
          if [ -f ios/Podfile ]; then
            sed -i '' "s/# platform :ios, '[0-9.]*'/platform :ios, '15.0'/g" ios/Podfile
            sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/g" ios/Podfile
          fi

      - name: Build iOS Release (No Codesign)
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --build-name=6.18.0 --build-number=618 2>&1 | tee ios_build.log

      - name: Package Runner.app into iMask-VPN-v6.18.ipa
        if: success()
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 iMask-VPN-v6.18.ipa Payload

      - name: Publish iMask-VPN-v6.18.ipa to GitHub Releases
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.18
          name: "iMask VPN v6.18 (BlackBox THC)"
          files: |
            iMask-VPN-v6.18.ipa
            ios_build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
